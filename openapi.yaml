openapi: 3.1.0
info:
  title: Zostaje API
  version: 0.0.4-alpha
  description: Versioned contract shared by native iOS and desktop clients.
servers:
  - url: http://127.0.0.1:4100
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API availability and contract version
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/sync/push:
    post:
      operationId: pushEncryptedSyncRecords
      summary: Push a bounded batch of opaque encrypted records
      security:
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: Batch merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        "400":
          description: Invalid encrypted batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/sync/pull:
    get:
      operationId: pullEncryptedSyncRecords
      summary: Pull opaque records changed after a monotonic cursor
      security:
        - deviceBearer: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Records visible to the authenticated owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"
        "400":
          description: Invalid cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/sync/export:
    get:
      operationId: exportEncryptedSyncRecords
      summary: Export the complete encrypted cloud copy
      security:
        - deviceBearer: []
      responses:
        "200":
          description: Portable, versioned encrypted export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptedExportResponse"
        "401":
          description: Invalid device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/sync:
    delete:
      operationId: deleteEncryptedCloudCopy
      summary: Delete every encrypted record owned by the authenticated owner
      security:
        - deviceBearer: []
      parameters:
        - name: X-Zostaje-Confirm-Delete
          in: header
          required: true
          description: Must be exactly delete-cloud-copy.
          schema:
            type: string
            const: delete-cloud-copy
      responses:
        "200":
          description: Cloud deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudDeletionResponse"
        "400":
          description: Missing destructive-action confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-token
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, apiVersion]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: zostaje-api
        apiVersion:
          type: string
          const: v1
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
    Money:
      type: object
      additionalProperties: false
      required: [minorUnits, currency]
      properties:
        minorUnits:
          type: integer
          description: Signed amount expressed in the currency's minor units.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    Entry:
      type: object
      additionalProperties: false
      description: Local plaintext domain object. It is encrypted before sync.
      required: [id, text, kind, status, source, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 2000
        kind:
          type: string
          enum: [note, expense, income, plan, goal, question]
        status:
          type: string
          enum: [inbox, confirmed, done, archived]
        source:
          type: string
          enum: [text, voice, receipt, import, shortcut, mcp]
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        category:
          type: string
          maxLength: 80
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Consequence:
      type: object
      additionalProperties: false
      required: [kind, explanation]
      properties:
        kind:
          type: string
          enum:
            - reduces_safe_to_spend
            - funds_goal
            - delays_goal
            - creates_commitment
            - matches_recurring_pattern
            - needs_answer
        explanation:
          type: string
          minLength: 1
          maxLength: 500
        delta:
          $ref: "#/components/schemas/Money"
    EncryptedSyncRecord:
      type: object
      additionalProperties: false
      description: Opaque record accepted by the optional E2E sync service.
      required:
        [
          id,
          deviceId,
          version,
          algorithm,
          keyVersion,
          nonce,
          ciphertext,
          deleted,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        algorithm:
          type: string
          const: AES-256-GCM
        keyVersion:
          type: integer
          minimum: 1
        nonce:
          type: string
          minLength: 16
          maxLength: 64
        ciphertext:
          type: string
          minLength: 16
        deleted:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    SyncConflict:
      type: object
      additionalProperties: false
      required: [id, reason, serverVersion]
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [stale_version, same_version_different_payload]
        serverVersion:
          type: integer
          minimum: 1
    SyncPushRequest:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/EncryptedSyncRecord"
    SyncPushResponse:
      type: object
      additionalProperties: false
      required: [accepted, unchanged, conflicts, cursor]
      properties:
        accepted:
          type: array
          items:
            type: string
            format: uuid
        unchanged:
          type: array
          items:
            type: string
            format: uuid
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/SyncConflict"
        cursor:
          type: integer
          minimum: 0
    SyncPullResponse:
      type: object
      additionalProperties: false
      required: [records, cursor]
      properties:
        records:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/EncryptedSyncRecord"
        cursor:
          type: integer
          minimum: 0
    EncryptedExportResponse:
      type: object
      additionalProperties: false
      required: [exportVersion, exportedAt, cursor, records]
      properties:
        exportVersion:
          type: integer
          const: 1
        exportedAt:
          type: string
          format: date-time
        cursor:
          type: integer
          minimum: 0
        records:
          type: array
          items:
            $ref: "#/components/schemas/EncryptedSyncRecord"
    CloudDeletionResponse:
      type: object
      additionalProperties: false
      required: [deletedRecords, deletedAt]
      properties:
        deletedRecords:
          type: integer
          minimum: 0
        deletedAt:
          type: string
          format: date-time
